<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tus-js-client@4/dist/tus.min.js"></script>

<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0;
}

body{
 font-family:Arial,Helvetica,sans-serif;
 background:#f8f9fb;
 color:#111;
}

button,input,textarea,select{
 font:inherit;
}

button{
 cursor:pointer;
}

.header{
 height:64px;
 background:#fff;
 border-bottom:1px solid #e5e7eb;
 display:flex;
 align-items:center;
 gap:18px;
 padding:0 20px;
 position:sticky;
 top:0;
 z-index:100;
}

.logo{
 font-size:24px;
 font-weight:900;
 color:#1976ff;
 white-space:nowrap;
}

.logo span{

}

.search{

 display:flex;
 margin:auto;
}

.search input{
 width:100%;
 height:42px;
 border:1px solid #d7dbe2;
 border-radius:22px 0 0 22px;
 padding:0 18px;
 outline:none;
 background:#fff;
}

.search button{
 width:55px;
 border:1px solid #d7dbe2;
 border-left:0;
 border-radius:0 22px 22px 0;
 background:#f3f4f6;
}

.headerBtn{
 border:0;
 background:#fff;
 padding:9px 14px;
 border-radius:20px;

}

.headerBtn:hover{
 background:#eef4ff;
}

.loginBtn{
 background:#1976ff;
 color:#fff;
}

.layout{
 display:flex;
 min-height:calc(100vh - 64px);
}

.sidebar{
 width:220px;
 background:#fff;
 border-right:1px solid #e5e7eb;
 padding:18px 10px;
 position:sticky;
 top:64px;
 height:calc(100vh - 64px);
}

.sideBtn{
 width:100%;
 text-align:left;
 border:0;
 background:#fff;
 padding:12px 15px;
 margin-bottom:4px;
 border-radius:10px;
 font-weight:600;
}

.sideBtn:hover,
.sideBtn.active{
 background:#edf4ff;
 color:#1265df;
}

.main{
 flex:1;
 padding:25px;
 max-width:1500px;
 margin:auto;
 width:100%;
}

.hero{
 background:linear-gradient(120deg,#edf5ff,#f5efff);
 border:1px solid #e3e8f2;
 border-radius:18px;
 padding:30px;
 margin-bottom:24px;
}

.hero h1{
 font-size:34px;
 margin-bottom:8px;
}

.hero p{
 color:#666;

}

.tabs{
 display:flex;
 gap:8px;
 overflow-x:auto;
 margin-bottom:22px;
 padding-bottom:3px;
}

.tab{

 background:#fff;
 border-radius:20px;
 padding:9px 17px;
 white-space:nowrap;
}

.tab.active{
 background:#111;
 color:#fff;
}

.videoGrid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
 gap:22px;
}

.card{
 background:#fff;
 border-radius:13px;
 overflow:hidden;
 border:1px solid #e5e7eb;
 cursor:pointer;
 transition:.18s;
}

.card:hover{
 transform:translateY(-2px);
 box-shadow:0 8px 25px #00000012;
}

.thumb{
 width:100%;
 aspect-ratio:16/9;
 background:#e8ebef;
 object-fit:cover;
 display:block;
}

.cardBody{
 padding:13px;
}

.cardTitle{
 font-size:16px;
 font-weight:700;
 line-height:1.35;
 margin-bottom:7px;
}

.meta{

 color:#70757d;
}

.empty{
 background:#fff;
 border:1px dashed #ccc;
 padding:40px;
 border-radius:15px;
 text-align:center;
 color:#777;
}

.modal{
 position:fixed;
 inset:0;
 background:#0008;
 display:none;
 align-items:center;
 justify-content:center;
 z-index:1000;
 padding:15px;
}

.modal.show{
 display:flex;
}

.modalBox{
 width:min(650px,100%);
 max-height:92vh;
 overflow:auto;
 background:#fff;
 border-radius:18px;
 padding:24px;
 position:relative;
}

.close{
 position:absolute;
 right:15px;
 top:12px;
 border:0;
 background:#eee;
 width:34px;
 height:34px;
 border-radius:50%;
 font-size:20px;
}

.modalBox h2{
 margin-bottom:20px;
}

.field{
 margin-bottom:15px;
}

.field label{
 display:block;
 font-size:14px;
 font-weight:700;
 margin-bottom:7px;
}

.field input,
.field textarea,
.field select{
 width:100%;
 border:1px solid #d7dbe2;
 border-radius:9px;
 padding:11px;
 outline:none;
 background:#fff;
}

.field textarea{
 min-height:100px;
 resize:vertical;
}

.primary{
 width:100%;
 border:0;
 border-radius:10px;
 background:#1976ff;
 color:#fff;
 padding:12px;
 font-weight:800;
}

.secondary{
 border:0;
 border-radius:9px;
 padding:10px 14px;
 background:#eee;
}

.watchBox{
 width:min(1000px,100%);
}

.watchVideo{
 width:100%;
 max-height:60vh;
 background:#000;
 border-radius:10px;
}

.watchTitle{
 font-size:22px;
 font-weight:800;
 margin-top:14px;
}

.watchActions{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin:13px 0;
}

.action{
 border:0;
 background:#eef1f5;
 padding:9px 14px;
 border-radius:20px;
}

.description{
 color:#555;
 line-height:1.5;
 background:#f6f7f9;
 padding:13px;
 border-radius:10px;
}

.comments{
 margin-top:18px;
}

.commentInput{
 display:flex;
 gap:8px;
 margin:12px 0;
}

.commentInput input{
 flex:1;
 border:1px solid #ddd;
 border-radius:20px;
 padding:10px 15px;
}

.comment{
 padding:11px 0;
 border-bottom:1px solid #eee;
}

.comment span{
 display:block;
 color:#555;
 margin-top:3px;
}

.toast{
 position:fixed;
 left:50%;
 bottom:25px;
 transform:translateX(-50%);
 background:#111;
 color:#fff;
 padding:12px 18px;
 border-radius:25px;
 display:none;
 z-index:3000;
}

.toast.show{
 display:block;
}

.uploadTray{
 position:fixed;
 right:18px;
 bottom:18px;
 width:min(380px,calc(100vw - 36px));
 background:#fff;
 border:1px solid #dfe3e8;
 box-shadow:0 10px 40px #0002;
 border-radius:16px;
 padding:16px;
 display:none;
 z-index:1500;
}

.uploadTray.show{
 display:block;
}

.utTop{
 display:flex;
 justify-content:space-between;
 gap:10px;
}

.utTitle{
 font-weight:800;
 overflow:hidden;
 text-overflow:ellipsis;
 white-space:nowrap;
}

.utStatus{
 color:#666;
 font-size:13px;
 margin:7px 0;
}

.progressBg{
 height:8px;
 background:#e8ebef;
 border-radius:10px;
 overflow:hidden;
}

.progress{
 height:100%;
 width:0;
 background:#1976ff;
 transition:width .2s;
}

.utRow{
 display:flex;
 justify-content:space-between;
 font-size:12px;
 color:#666;
 margin-top:7px;
}

.utButtons{
 display:flex;
 gap:8px;
 margin-top:12px;
}

.utButtons button{
 flex:1;
 border:0;
 border-radius:8px;
 padding:9px;
}

#cancelUpload{
 background:#eee;
}

#retryUpload{
 background:#1976ff;
 color:#fff;
 display:none;
}

@media(max-width:800px){
 .sidebar{
  display:none;
 }

 .main{
  padding:15px;

 .header{
  padding:0 10px;
  gap:8px;
 }

 .logo{
  font-size:20px;

 .headerBtn{
  padding:8px;

 .hero h1{

  grid-template-columns:repeat(2,minmax(0,1fr));

 .cardBody{
  padding:9px;
 }

 .search{
  min-width:0;

 .search input{
  padding:0 10px;

 .watchTitle{
  font-size:18px;

}

@media(max-width:480px){
 .videoGrid{
  grid-template-columns:1fr;
 }

 .hero{
  padding:20px;
 }
}
</style>
</head>

<script>

const SUPABASE_URL =
 "https://ddwokezrocpzfhxgltbc.supabase.co";

/*
 अपना Supabase Publishable Key यहाँ डालें।
 service_role या secret key यहाँ कभी न डालें।
*/
const SUPABASE_PUBLISHABLE_KEY =
 "sb_publishable_6V6qmPBuNC8CaAu3zbdnFg_SdXDZEk0";

const sb =
 supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let currentUser = null;
let currentVideo = null;
let currentCategory = "All";
let authMode = "login";
let activeUpload = null;
let lastUploadData = null;
let uploadCancelled = false;
let uploadStartedAt = 0;

const $ = id =>
 document.getElementById(id);

function toast(message){

 const el = $("toast");

 el.textContent = message;
 el.classList.add("show");

 clearTimeout(el._timer);

 el._timer =
  setTimeout(()=>{
   el.classList.remove("show");
  },3000);
}

function showModal(id){
 $(id).classList.add("show");
}

function closeModal(id){
 $(id).classList.remove("show");
}

function formatMB(bytes){

 return (
  Number(bytes||0) /
  1024 /
  1024
 ).toFixed(1)+" MB";
}

function formatViews(value){

 const n = Number(value||0);

 if(n>=1000000)
  return (n/1000000).toFixed(1)+"M";

 if(n>=1000)
  return (n/1000).toFixed(1)+"K";

 return String(n);
}

function escapeHTML(value){

 return String(value||"")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

function timeAgo(date){

 const diff =
  Date.now() -
  new Date(date).getTime();

 const min =
  Math.floor(diff/60000);

 if(min<1)
  return "Just now";

 if(min<60)
  return min+" min ago";

 const hr =
  Math.floor(min/60);

 if(hr<24)
  return hr+" hr ago";

 const day =
  Math.floor(hr/24);

 if(day<30)
  return day+" days ago";

 return new Date(date)
  .toLocaleDateString();
}

async function loadUser(){

 const {data} =
  await sb.auth.getSession();

 currentUser =
  data?.session?.user || null;

 updateHeader();
}

function updateHeader(){

 const btn = $("authBtn");

 if(currentUser){

  btn.textContent =
   "Logout";

  btn.classList.remove("loginBtn");

 }else{

  btn.textContent =
   "Sign In";

  btn.classList.add("loginBtn");
 }
}function renderVideos(videos){

 const grid =
  $("videoGrid");

 if(!videos || !videos.length){

  grid.innerHTML =
   `<div class="empty">
     अभी इस category में कोई video नहीं है।
    </div>`;

  return;
 }

 grid.innerHTML =
  videos.map(video=>{

   const thumb =
    video.thumbnail_url ||
    "https://placehold.co/640x360?text=UTubeX";

   return `
    <article class="card"
     data-video-id="${escapeHTML(video.id)}">

     <img
      class="thumb"
      src="${escapeHTML(thumb)}"
      loading="lazy"
      alt="thumbnail">

     <div class="cardBody">

      <div class="cardTitle">
       ${escapeHTML(video.title||"Untitled")}
      </div>

      <div class="meta">
       ${formatViews(video.views)} views
       •
       ${timeAgo(video.created_at)}
      </div>

     </div>
    </article>
   `;

  }).join("");

 grid
  .querySelectorAll(".card")
  .forEach(card=>{

   card.addEventListener(
    "click",
    ()=>{
     openVideo(
      card.dataset.videoId
     );
    }
   );

  });
}

async function loadVideos(){

 let query =
  sb
  .from("videos")
  .select("*")
  .eq("status","published")
  .order(
   "created_at",
   {ascending:false}
  )
  .limit(100);

 if(
  currentCategory &&
  currentCategory!=="All"
 ){

  query =
   query.eq(
    "category",
    currentCategory
   );
 }

 const {data,error} =
  await query;

 if(error){

  console.error(error);

  toast(
   "Videos load नहीं हुए"
  );

  return;
 }

 renderVideos(data||[]);
}

function setCategory(category){

 currentCategory =
  category;

 document
  .querySelectorAll(
   ".tab,.sideBtn"
  )
  .forEach(button=>{

   button.classList.toggle(
    "active",
    button.dataset.category ===
    category
   );

  });

 loadVideos();
}

function searchVideos(){

 const q =
  $("searchInput")
  .value
  .trim()
  .toLowerCase();

 if(!q){

  loadVideos();
  return;
 }

 sb
 .from("videos")
 .select("*")
 .eq("status","published")
 .order(
  "created_at",
  {ascending:false}
 )
 .limit(100)
 .then(({data,error})=>{

  if(error){

   toast("Search error");
   return;
  }

  const result =
   (data||[]).filter(video=>{

    const text =
     (
      (video.title||"")+
      " "+
      (video.description||"")+
      " "+
      (video.tags||"")
     ).toLowerCase();

    return text.includes(q);
   });

  renderVideos(result);
 });
}


/* AUTH */

function openAuth(){

 authMode="login";

 $("authTitle").textContent =
  "Sign In";

 $("authSubmit").textContent =
  "Sign In";

 $("authSwitch").textContent =
  "Create new account";

 showModal("authModal");
}

async function submitAuth(){

 const email =
  $("authEmail")
  .value
  .trim();

 const password =
  $("authPassword")
  .value;

 if(!email || !password){

  toast(
   "Email और Password डालें"
  );

  return;
 }

 $("authSubmit").disabled=true;

 if(authMode==="login"){

  const {error} =
   await sb.auth.signInWithPassword({
    email,
    password
   });

  $("authSubmit").disabled=false;

  if(error){

   toast(error.message);
   return;
  }

  closeModal("authModal");

  toast("Login successful");

  await loadUser();

 }else{

  const {error} =
   await sb.auth.signUp({
    email,
    password,
    options:{
     emailRedirectTo:
      "https://utubex.github.io/UTubeX/"
    }
   });

  $("authSubmit").disabled=false;

  if(error){

   toast(error.message);
   return;
  }

  toast(
   "Account बन गया। Email confirm करें।"
  );

  closeModal("authModal");
 }
}

async function logout(){

 await sb.auth.signOut();

 currentUser=null;

 updateHeader();

 toast("Logged out");
}


/* UPLOAD */

function openUpload(){

 if(!currentUser){

  toast(
   "पहले Sign In करें"
  );

  openAuth();
  return;
 }

 showModal("uploadModal");
}

function showUploadTray(title){

 $("uploadTray")
  .classList.add("show");

 $("utTitle").textContent =
  title || "Uploading...";

 $("utProgress")
  .style.width="0%";

 $("utPercent")
  .textContent="0%";

 $("utSize")
  .textContent=
   "0 MB / 0 MB";

 $("utSpeed")
  .textContent="";

 $("utStatus")
  .textContent=
   "Preparing...";

 $("retryUpload")
  .style.display="none";

 $("cancelUpload")
  .style.display="block";
}

function hideUploadTray(){

 $("uploadTray")
  .classList.remove("show");
}

function updateUploadProgress(
 uploaded,
 total
){

 const percent =
  total
   ? Math.min(
      100,
      uploaded/total*100
     )
   : 0;

 $("utProgress")
  .style.width =
   percent.toFixed(1)+"%";

 $("utPercent")
  .textContent =
   Math.round(percent)+"%";

 $("utSize")
  .textContent =
   formatMB(uploaded)+
   " / "+
   formatMB(total);

 const elapsed =
  (performance.now()-
   uploadStartedAt)/1000;

 if(elapsed>0){

  const speed =
   uploaded/
   1024/
   1024/
   elapsed;

  $("utSpeed")
   .textContent =
    speed.toFixed(1)+
    " MB/s";
 }
}

function setUploadStatus(text){

 $("utStatus")
  .textContent=text;
}

async function startPublish(){

 if(!currentUser){

  toast(
   "पहले Sign In करें"
  );

  return;
 }

 const video =
  $("videoFile")
  .files[0];

 const thumb =
  $("thumbFile")
  .files[0];

 const title =
  $("videoTitle")
  .value
  .trim();

 if(!video){

  toast(
   "Video select करें"
  );

  return;
 }

 if(
  video.size >
  50*1024*1024
 ){

  toast(
   "अभी maximum 50 MB video upload कर सकते हैं"
  );

  return;
 }

 if(!title){

  toast(
   "Video title डालें"
  );

  return;
 }

 lastUploadData = {

  video,
  thumb,
  title,

  description:
   $("videoDescription")
   .value
   .trim(),

  category:
   $("videoCategory")
   .value,

  language:
   $("videoLanguage")
   .value,

  tags:
   $("videoTags")
   .value
   .trim(),

  visibility:
   $("videoVisibility")
   .value
 };

 closeModal("uploadModal");

 showUploadTray(title);

 runUpload(
  lastUploadData
 );
}

async function runUpload(data){

 if(!data || !currentUser)
  return;

 uploadCancelled=false;

 showUploadTray(
  data.title
 );

 setUploadStatus(
  "Uploading video..."
 );

 const file =
  data.video;

 uploadStartedAt =
  performance.now();

 const objectName =
  currentUser.id+
  "/"+
  Date.now()+
  "-"+
  safeFileName(file.name);

 const endpoint =
  SUPABASE_URL+
  "/storage/v1/upload/resumable";

 const upload =
  new tus.Upload(
   file,
   {

    endpoint,

    retryDelays:[
     0,
     1000,
     3000,
     5000,
     10000
    ],

    headers:{
     apikey:
      SUPABASE_PUBLISHABLE_KEY,

     Authorization:
      "Bearer "+
      SUPABASE_PUBLISHABLE_KEY
    },

    metadata:{

     bucketName:
      "videos",

     objectName:
      objectName,

     contentType:
      file.type ||
      "video/mp4",

     cacheControl:
      "3600",

     upsert:
      "false"
    },

    onError(error){

     console.error(error);

     if(uploadCancelled)
      return;

     setUploadStatus(
      "Upload failed"
     );

     $("retryUpload")
      .style.display="block";

     $("cancelUpload")
      .style.display="none";

     toast(
      "Video upload failed"
     );
    },

    onProgress(
     bytesUploaded,
     bytesTotal
    ){

     updateUploadProgress(
      bytesUploaded,
      bytesTotal
     );
    },

    async onSuccess(){

     if(uploadCancelled)
      return;

     $("utProgress")
      .style.width="100%";

     $("utPercent")
      .textContent="100%";

     setUploadStatus(
      "Video uploaded ✓"
     );

     let thumbURL="";

     if(data.thumb){

      setUploadStatus(
       "Uploading thumbnail..."
      );

      const thumbPath =
       currentUser.id+
       "/"+
       Date.now()+
       "-"+
       safeFileName(
        data.thumb.name
       );

      const result =
       await sb
       .storage
       .from("thumbnails")
       .upload(
        thumbPath,
        data.thumb,
        {
         upsert:false,
         contentType:
          data.thumb.type
        }
       );

      if(!result.error){

       const publicData =
        sb
        .storage
        .from("thumbnails")
        .getPublicUrl(
         thumbPath
        );

       thumbURL =
        publicData
        .data
        .publicUrl;
      }
     }

     setUploadStatus(
      "Publishing..."
     );

     let duration=0;

     try{

      duration =
       await getVideoDuration(
        file
       );

     }catch(e){

      duration=0;
     }

     const publicURL =
      SUPABASE_URL+
      "/storage/v1/object/public/videos/"+
      objectName;

     const {error} =
      await sb
      .from("videos")
      .insert({

       user_id:
        currentUser.id,

       title:
        data.title,

       description:
        data.description,

       video_url:
        publicURL,

       thumbnail_url:
        thumbURL,

       category:
        data.category,

       language:
        data.language,

       tags:
        data.tags,

       visibility:
        data.visibility,

       status:
        "published",

       views:0,

       likes:0,

       comments_count:0,

       duration_seconds:
        Math.round(duration)
      });

     if(error){

      console.error(error);

      setUploadStatus(
       "Publishing failed"
      );

      $("retryUpload")
       .style.display="block";

      $("cancelUpload")
       .style.display="none";

      return;
     }

     setUploadStatus(
      "Published ✓"
     );

     $("utSpeed")
      .textContent="Complete";

     toast(
      "Video successfully published"
     );

     lastUploadData=null;

     await loadVideos();

     setTimeout(
      hideUploadTray,
      4000
     );
    }
   }
  );

 activeUpload =
  upload;

 try{

  const previous =
   await upload
   .findPreviousUploads();

  if(previous.length){

   upload
    .resumeFromPreviousUpload(
     previous[0]
    );
  }

 }catch(error){

  console.log(
   "Resume check skipped",
   error
  );
 }

 upload.start();
}function cancelUpload(){

 uploadCancelled=true;

 try{

  if(activeUpload)
   activeUpload.abort();

 }catch(e){}

 setUploadStatus(
  "Upload cancelled"
 );

 $("cancelUpload")
  .style.display="none";

 $("retryUpload")
  .style.display="block";
}

function retryUpload(){

 if(!lastUploadData){

  toast(
   "Retry data उपलब्ध नहीं है"
  );

  return;
 }

 $("retryUpload")
  .style.display="none";

 $("cancelUpload")
  .style.display="block";

 runUpload(
  lastUploadData
 );
}

function safeFileName(name){

 return String(name||"video")
  .replace(
   /[^a-zA-Z0-9._-]/g,
   "-"
  )
  .replace(
   /-+/g,
   "-"
  );
}

function getVideoDuration(file){

 return new Promise(
  (resolve,reject)=>{

   const url =
    URL.createObjectURL(
     file
    );

   const video =
    document.createElement(
     "video"
    );

   video.preload="metadata";

   video.onloadedmetadata=()=>{

    URL.revokeObjectURL(
     url
    );

    resolve(
     video.duration || 0
    );
   };

   video.onerror=()=>{

    URL.revokeObjectURL(
     url
    );

    reject(
     new Error(
      "metadata error"
     )
    );
   };

   video.src=url;
  }
 );
}

/* COMMENTS */

async function loadComments(
 videoId
){

 const box =
  $("comments");

 box.innerHTML =
  "<div>Loading comments...</div>";

 const {data,error} =
  await sb
  .from("video_comments")
  .select("*")
  .eq(
   "video_id",
   videoId
  )
  .order(
   "created_at",
   {ascending:true}
  );

 if(error){

  box.innerHTML =
   "<div>Comments load नहीं हुए</div>";

  return;
 }

 if(!data || !data.length){

  box.innerHTML =
   "<div style='color:#777'>No comments yet.</div>";

  return;
 }

 box.innerHTML =
  data.map(comment=>`

   <div class="comment">

    <b>User</b>

    <span>
     ${escapeHTML(
      comment.comment||""
     )}
    </span>

   </div>

  `).join("");
}

 }

  .from("video_comments")
  .insert({

   video_id:
    currentVideo.id,

   user_id:

  );

 $("commentInput")

 );

 toast(

 );
}
