<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UTubeX</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#111;background:#fff}
header{height:64px;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:18px;padding:0 18px;position:sticky;top:0;background:#fff;z-index:10}
.logo{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:800;color:#5146e5}
.logo img{width:38px;height:38px;object-fit:contain}
.search{flex:1;max-width:620px;margin:auto}.search input{width:100%;height:42px;border:1px solid #ccc;border-radius:22px;padding:0 18px}
.login,.primary{background:#5146e5;color:#fff;border:0;border-radius:22px;padding:10px 18px;cursor:pointer}
.layout{display:flex}aside{width:220px;position:fixed;top:64px;bottom:0;border-right:1px solid #eee;padding:15px;background:#fff}
aside button{display:block;width:100%;padding:13px;border:0;background:#fff;text-align:left;border-radius:9px;margin-bottom:5px;cursor:pointer}
aside button:hover{background:#f1f1f1}
.channel-mini{border-bottom:1px solid #eee;padding:10px 5px 16px;margin-bottom:10px}
.channel-mini img{width:48px;height:48px;object-fit:contain;display:block;margin-bottom:6px}
.main{margin-left:220px;padding:22px;width:calc(100% - 220px)}
.chips{display:flex;gap:9px;overflow:auto;margin-bottom:22px}.chips button{border:0;padding:9px 16px;border-radius:20px;white-space:nowrap;cursor:pointer}
.hero{padding:30px;border-radius:18px;background:linear-gradient(120deg,#5146e5,#8b5cf6);color:#fff;margin-bottom:25px}
.hero h1{margin:0 0 8px;font-size:30px}.hero button{padding:11px 18px;border:0;border-radius:22px;cursor:pointer}
.title{margin:22px 0 14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{border:1px solid #eee;border-radius:13px;overflow:hidden}.thumb{height:145px;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:38px}
.card div:last-child{padding:12px}.card p{font-size:13px;color:#666}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:center;justify-content:center;padding:15px}
.box{background:#fff;width:100%;max-width:430px;padding:24px;border-radius:18px}
.box input,.box select{width:100%;height:44px;margin:7px 0;padding:0 12px;border:1px solid #ccc;border-radius:8px}
.full{width:100%;margin-top:8px}.close{float:right;border:0;border-radius:50%;width:30px;height:30px;cursor:pointer}
@media(max-width:800px){aside{width:70px;padding:8px}aside button{font-size:0;text-align:center}.channel-mini{display:none}.main{margin-left:70px;width:calc(100% - 70px)}.grid{grid-template-columns:repeat(2,1fr)}.search{display:none}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.main{padding:12px}}
</style>
</head>

<body>

<header>
<div class="logo">
<img src="logo.png" alt="UTubeX">
<span>UTubeX</span>
</div>

<div class="search">
<input id="search" placeholder="Search videos, movies, music...">
</div>

<button class="login" onclick="openBox('loginBox')">Login</button>
</header>

<div
