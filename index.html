<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>UTubeX — Watch, Upload & Share</title>
<meta name="description" content="UTubeX — Watch, upload and share videos.">
<link rel="icon" href="logo.png">
<style>
:root{
  --bg:#fff;--text:#0f0f0f;--muted:#606060;--line:#e5e5e5;
  --soft:#f2f2f2;--brand:#2563eb;--brand2:#7c3aed;--danger:#dc2626;
  --shadow:0 8px 30px rgba(0,0,0,.10);--radius:14px;
}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);
font-family:Arial,Helvetica,sans-serif}button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}a{text-decoration:none;color:inherit}
body{padding-bottom:72px}.app{min-height:100vh}
.topbar{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;
gap:14px;padding:0 18px;position:sticky;top:0;background:rgba(255,255,255,.97);
backdrop-filter:blur(10px);z-index:30}
.menuBtn{width:40px;height:40px;border-radius:50%;background:transparent;font-size:22px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;white-space:nowrap}
.brandMark{width:34px;height:24px;border-radius:8px;background:linear-gradient(135deg,#ef4444,#dc2626);
display:grid;place-items:center;color:white;font-size:13px;font-weight:900;box-shadow:0 3px 10px #0002}
.searchWrap{display:flex;flex:1;max-width:720px;margin:auto}
.searchWrap input{height:42px;border:1px solid #cfcfcf;border-right:0;border-radius:22px 0 0 22px;padding:0 18px;outline:0;width:100%;font-size:16px}
.searchBtn{width:62px;border:1px solid #cfcfcf;background:#f8f8f8;border-radius:0 22px 22px 0}
.micBtn{margin-left:8px;width:42px;height:42px;border-radius:50%;background:#f2f2f2}
.topActions{display:flex;align-items:center;gap:7px}.iconBtn{background:transparent;width:40px;height:40px;border-radius:50%;font-size:20px}
.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#ddd}
.side{position:fixed;top:64px;bottom:0;left:0;width:232px;border-right:1px solid var(--line);
padding:12px 10px;background:#fff;overflow:auto;z-index:20}
.sideItem{display:flex;align-items:center;gap:16px;width:100%;padding:12px 14px;border-radius:10px;background:#fff;text-align:left;font-size:14px}
.sideItem:hover,.sideItem.active{background:#f2f2f2;font-weight:700}.sideIcon{width:22px;text-align:center;font-size:19px}
.main{margin-left:232px;padding:18px 24px;max-width:1600px}
.chips{display:flex;gap:10px;overflow:auto;padding:2px 0 18px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{background:#f2f2f2;border-radius:9px;padding:9px 15px;white-space:nowrap;font-size:14px}.chip.active{background:#111;color:#fff}
.hero{border-radius:18px;background:linear-gradient(120deg,#eff6ff,#faf5ff);padding:26px;margin-bottom:22px;
display:flex;align-items:center;justify-content:space-between;gap:20px}.hero h1{margin:0 0 8px;font-size:28px}.hero p{margin:0;color:var(--muted)}
.primary{background:#111;color:#fff;border-radius:22px;padding:11px 18px;font-weight:700}
.videoGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 16px}
.card{min-width:0}.thumb{aspect-ratio:16/9;background:#eee;border-radius:11px;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}.duration{position:absolute;right:7px;bottom:7px;background:#111;color:#fff;
font-size:12px;padding:3px 5px;border-radius:4px}.cardInfo{display:flex;gap:10px;padding-top:10px}.miniAvatar{width:36px;height:36px;border-radius:50%;background:#ddd;object-fit:cover;flex:none}
.cardTitle{font-weight:700;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{color:var(--muted);font-size:13px;line-height:1.5;margin-top:4px}.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.bottomNav{display:none}
.modalBack{position:fixed;inset:0;background:#0008;z-index:80;display:none;align-items:center;justify-content:center;padding:14px}
.modal{background:#fff;border-radius:18px;width:min(720px,100%);max-height:92vh;overflow:auto;box-shadow:var(--shadow)}
.modal.wide{width:min(1100px,100%)}.modalHead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modalHead h2{margin:0;font-size:20px}.close{background:#f2f2f2;width:36px;height:36px;border-radius:50%;font-size:20px}
.form{padding:20px}.field{margin-bottom:15px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
.field input,.field textarea,.field select{width:100%;border:1px solid #d2d2d2;border-radius:10px;padding:11px;outline:0;background:#fff}
.field textarea{min-height:100px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fileBox{border:2px dashed #cfcfcf;border-radius:12px;padding:20px;text-align:center;color:var(--muted)}
.fileBox input{display:block;margin:10px auto}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.secondary{background:#eee;border-radius:20px;padding:10px 17px}
.progress{height:10px;background:#eee;border-radius:20px;overflow:hidden}.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.progressText{font-size:13px;color:var(--muted);margin-top:8px}
.watchPlayer{width:100%;aspect-ratio:16/9;background:#000}.watchPlayer video{width:100%;height:100%;display:block}
.watchBody{padding:18px}.watchTitle{font-size:22px;font-weight:800;margin:0 0 8px}.watchMeta{color:var(--muted);font-size:14px}
.watchActions{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.roundBtn{background:#f2f2f2;border-radius:22px;padding:10px 15px}
.roundBtn.on{background:#111;color:#fff}.desc{white-space:pre-wrap;background:#f5f5f5;border-radius:12px;padding:14px;font-size:14px}
.comments{margin-top:20px}.comment{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}.comment p{margin:2px 0}.comment .meta{font-size:12px}
.channelCover{height:170px;background:linear-gradient(120deg,#dbeafe,#ede9fe);border-radius:14px 14px 0 0}
.channelTop{padding:0 20px 18px;display:flex;gap:18px;align-items:flex-end}.channelAvatar{width:100px;height:100px;border-radius:50%;object-fit:cover;background:#ddd;border:5px solid #fff;margin-top:-50px}
.channelName{font-size:25px;font-weight:800}.handle{color:var(--muted);margin-top:3px}.verify{display:inline-grid;place-items:center;width:19px;height:19px;background:#2563eb;color:#fff;border-radius:50%;font-size:12px;margin-left:5px}
.channelBio{padding:0 20px 18px;color:#444}.officialBox{background:#f8fbff;border:1px solid #dbeafe;border-radius:14px;padding:14px;margin-bottom:18px}
.toast{position:fixed;right:18px;bottom:86px;background:#111;color:#fff;padding:12px 16px;border-radius:10px;z-index:100;display:none;box-shadow:var(--shadow)}
.uploadFloat{position:fixed;right:18px;bottom:86px;width:330px;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);z-index:70;display:none}
.uploadFloat .ufHead{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between}
.uploadFloat .ufBody{padding:13px}.ufSmall{font-size:12px;color:var(--muted);margin-top:6px}
@media(max-width:1100px){.videoGrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:800px){
  body{padding-bottom:66px}.topbar{padding:0 10px;height:58px}.brand{font-size:18px}.brandMark{width:31px;height:22px}
  .searchWrap{max-width:none}.searchWrap input{height:38px}.searchBtn{width:45px}.micBtn{display:none}.topActions .iconBtn{display:none}
  .side{display:none}.main{margin-left:0;padding:12px 10px 20px}.hero{display:none}.chips{padding-bottom:12px}
  .videoGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 9px}.thumb{border-radius:8px}.cardInfo{gap:7px;padding-top:7px}.miniAvatar{width:30px;height:30px}
  .cardTitle{font-size:13px}.meta{font-size:11px}.bottomNav{position:fixed;display:flex;left:0;right:0;bottom:0;height:64px;background:#fff;border-top:1px solid var(--line);z-index:60;justify-content:space-around}
  .bottomNav button{background:#fff;flex:1;font-size:10px;color:#333}.bottomNav b{display:block;font-size:20px;line-height:26px}
  .bottomNav .active{font-weight:800}.modalBack{padding:0;align-items:flex-end}.modal{width:100%;max-height:94vh;border-radius:18px 18px 0 0}.row{grid-template-columns:1fr}
  .uploadFloat{right:8px;left:8px;bottom:72px;width:auto}.channelCover{height:130px}.channelTop{padding:0 14px 14px;align-items:center}.channelAvatar{width:78px;height:78px;margin-top:-35px}.channelName{font-size:21px}.channelBio{padding:0 14px 15px}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <button class="menuBtn" id="menuBtn">☰</button>
  <a class="brand" href="#" onclick="showHome();return false"><span class="brandMark">▶</span>UTubeX</a>
  <div class="searchWrap">
    <input id="searchInput" placeholder="Search" autocomplete="off">
    <button class="searchBtn" id="searchBtn">⌕</button>
  </div>
  <button class="micBtn" title="Search">🎙️</button>
  <div class="topActions">
    <button class="iconBtn" id="uploadTop" title="Upload">＋</button>
    <button class="iconBtn" id="loginTop" title="Login">👤</button>
    <img id="topAvatar" class="avatar" style="display:none">
  </div>
</header>

<aside class="side" id="side">
  <button class="sideItem active" data-page="home">🏠 <span>Home</span></button>
  <button class="sideItem" data-page="trending">🔥 <span>Trending</span></button>
  <button class="sideItem" data-cat="Music">🎵 <span>Music</span></button>
  <button class="sideItem" data-cat="Movies">🎬 <span>Movies</span></button>
  <button class="sideItem" data-cat="Gaming">🎮 <span>Gaming</span></button>
  <button class="sideItem" data-cat="Education">📚 <span>Education</span></button>
  <button class="sideItem" data-cat="News">📰 <span>News</span></button>
  <hr style="border:0;border-top:1px solid #eee;margin:12px">
  <button class="sideItem" id="sideUpload">⬆️ <span>Upload</span></button>
  <button class="sideItem" id="sideChannel">👤 <span>My Channel</span></button>
  <button class="sideItem" id="sideSubscriptions">📺 <span>Subscriptions</span></button>
  <button class="sideItem" id="sideLogin">🔐 <span>Login / Sign up</span></button>
</aside>

<main class="main">
  <div class="chips" id="chips">
    <button class="chip active" data-cat="">All</button><button class="chip" data-cat="Music">Music</button>
    <button class="chip" data-cat="Movies">Movies</button><button class="chip" data-cat="Gaming">Gaming</button>
    <button class="chip" data-cat="Education">Education</button><button class="chip" data-cat="News">News</button>
    <button class="chip" data-cat="Entertainment">Entertainment</button>
  </div>
  <section class="hero">
    <div><h1>Welcome to UTubeX</h1><p>Watch, upload and share your videos.</p></div>
    <button class="primary" id="heroUpload">Upload video</button>
  </section>
  <div id="pageTitle" style="font-size:20px;font-weight:800;margin:0 0 16px">Recommended</div>
  <section class="videoGrid" id="videoGrid"></section>
</main>

<nav class="bottomNav">
  <button class="active" id="bnHome"><b>⌂</b>Home</button>
  <button id="bnTrending"><b>🔥</b>Trending</button>
  <button id="bnCreate"><b>＋</b>Create</button>
  <button id="bnSubs"><b>📺</b>Subscriptions</button>
  <button id="bnYou"><b>👤</b>You</button>
</nav>
</div>

<div class="modalBack" id="authBack">
<div class="modal"><div class="modalHead"><h2 id="authTitle">Login</h2><button class="close" data-close="authBack">×</button></div>
<div class="form">
<div class="field"><label>Email</label><input id="authEmail" type="email" autocomplete="email"></div>
<div class="field"><label>Password</label><input id="authPassword" type="password" autocomplete="current-password"></div>
<div id="signupExtra" style="display:none">
<div class="field"><label>Channel / Name</label><input id="authName" maxlength="80" placeholder="Your channel name"></div>
</div>
<button class="primary" id="authSubmit" style="width:100%">Login</button>
<button class="secondary" id="authSwitch" style="width:100%;margin-top:10px">Create a new account</button>
<p id="authMsg" class="meta"></p>
</div></div></div>

<div class="modalBack" id="uploadBack">
<div class="modal"><div class="modalHead"><h2>Upload video</h2><button class="close" data-close="uploadBack">×</button></div>
<form class="form" id="uploadForm">
<div class="field"><label>Video file</label><div class="fileBox">Choose your video<input id="videoFile" type="file" accept="video/*"></div></div>
<div class="field"><label>Thumbnail (optional)</label><div class="fileBox">Choose thumbnail<input id="thumbFile" type="file" accept="image/*"></div></div>
<div class="field"><label>Title</label><input id="videoTitle" maxlength="100" required placeholder="Add a title"></div>
<div class="field"><label>Description</label><textarea id="videoDesc" maxlength="5000" placeholder="Tell viewers about your video"></textarea></div>
<div class="row"><div class="field"><label>Category</label><select id="videoCat"><option>Entertainment</option><option>Music</option><option>Movies</option><option>Gaming</option><option>Education</option><option>News</option></select></div>
<div class="field"><label>Language</label><select id="videoLang"><option>Hindi</option><option>English</option><option>Bhojpuri</option><option>Other</option></select></div></div>
<div class="field"><label>Tags</label><input id="videoTags" maxlength="500" placeholder="music, movie, gaming"></div>
<div class="field"><label>Visibility</label><select id="videoVisibility"><option>Public</option><option>Unlisted</option><option>Private</option></select></div>
<div id="uploadProgressBox" style="display:none"><div class="progress"><i id="uploadBar"></i></div><div class="progressText" id="uploadText">Preparing…</div></div>
<div class="actions"><button type="button" class="secondary" data-close="uploadBack">Cancel</button><button class="primary" id="publishBtn" type="submit">Publish</button></div>
</form></div></div>

<div class="modalBack" id="watchBack">
<div class="modal wide"><div class="modalHead"><h2>Watch</h2><button class="close" data-close="watchBack">×</button></div>
<div class="watchPlayer"><video id="watchVideo" controls playsinline></video></div>
<div class="watchBody">
<h1 class="watchTitle" id="watchTitle"></h1><div class="watchMeta" id="watchMeta"></div>
<div class="watchActions"><button class="roundBtn" id="likeBtn">👍 Like</button><button class="roundBtn" id="subBtn">🔔 Subscribe</button><button class="roundBtn" id="shareBtn">↗ Share</button></div>
<div class="desc" id="watchDesc"></div>
<div class="comments"><h3>Comments</h3><div id="commentList"></div>
<div class="field" style="margin-top:12px"><input id="commentInput" placeholder="Add a comment…"><button class="primary" id="commentBtn" style="margin-top:8px">Comment</button></div></div>
</div></div></div>

<div class="modalBack" id="channelBack">
<div class="modal wide"><div class="modalHead"><h2>Channel</h2><button class="close" data-close="channelBack">×</button></div>
<div id="channelContent"></div></div></div>

<div class="uploadFloat" id="uploadFloat">
<div class="ufHead"><span id="ufTitle">Upload</span><button id="ufClose">×</button></div>
<div class="ufBody"><div class="progress"><i id="ufBar"></i></div><div id="ufText" class="ufSmall">Preparing…</div></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tus-js-client@4/dist/tus.min.js"></script>
<script>
/* =========================
   UTubeX CONFIG
   यहाँ केवल अपनी Supabase जानकारी डालें।
   ========================= */
const SUPABASE_URL="https://ddwokezrocpzfhxgltbc.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_6V6qmPBuNC8CaAu3zbdnFg_SdXDZEk0";
const VIDEO_BUCKET="videos";
const THUMB_BUCKET="thumbnails";

const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let currentUser=null,currentVideo=null,currentCategory="",authMode="login",allVideos=[];
const $=id=>document.getElementById(id);
function toast(t){$("toast").textContent=t;$("toast").style.display="block";clearTimeout(window.__toast);window.__toast=setTimeout(()=>$("toast").style.display="none",2800)}
function openModal(id){$(id).style.display="flex"}function closeModal(id){$(id).style.display="none"}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function formatViews(n){n=Number(n||0);return n>=1000000?(n/1000000).toFixed(1)+"M":n>=1000?(n/1000).toFixed(1)+"K":String(n)}
function ago(d){const x=(Date.now()-new Date(d).getTime())/1000;if(x<60)return "just now";if(x<3600)return Math.floor(x/60)+"m ago";if(x<86400)return Math.floor(x/3600)+"h ago";if(x<2592000)return Math.floor(x/86400)+"d ago";return new Date(d).toLocaleDateString()}
function duration(sec){sec=Number(sec||0);if(!sec)return "";let m=Math.floor(sec/60),s=String(sec%60).padStart(2,"0");return m+":"+s}
function showHome(){closeModal("channelBack");currentCategory="";setActiveChip("");$("pageTitle").textContent="Recommended";loadVideos()}
function setActiveChip(cat){document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",(x.dataset.cat||"")===(cat||"")))}
function userAvatar(p){return p?.avatar_url||""}
function initials(name){return (name||"UT").trim().slice(0,2).toUpperCase()}
function avatarHtml(p,cls="miniAvatar"){return p?.avatar_url?`<img class="${cls}" src="${esc(p.avatar_url)}" alt="">`:`<div class="${cls}" style="display:grid;place-items:center;font-weight:800">${esc(initials(p?.full_name||p?.username||"UT"))}</div>`}
async function getProfile(uid){if(!uid)return null;const r=await sb.from("profiles").select("id,full_name,username,bio,avatar_url,banner_url").eq("id",uid).maybeSingle();return r.data||null}
async function requireLogin(){if(currentUser)return true;openModal("authBack");return false}

async function loadVideos(){
  $("videoGrid").innerHTML='<div class="empty" style="grid-column:1/-1">Loading…</div>';
  let q=sb.from("videos").select("*").eq("status","published").order("created_at",{ascending:false}).limit(80);
  if(currentCategory)q=q.eq("category",currentCategory);
  const {data,error}=await q;
  if(error){console.error(error);$("videoGrid").innerHTML='<div class="empty" style="grid-column:1/-1">Videos load नहीं हो पाए।</div>';return}
  allVideos=data||[];renderVideos(allVideos);
}
async function renderVideos(videos){
  if(!videos.length){$("videoGrid").innerHTML='<div class="empty" style="grid-column:1/-1">अभी कोई public video नहीं है। पहला video आप upload कर सकते हैं।</div>';return}
  const ids=[...new Set(videos.map(v=>v.user_id).filter(Boolean))];
  let profiles={};
  if(ids.length){const r=await sb.from("profiles").select("id,full_name,username,avatar_url").in("id",ids);(r.data||[]).forEach(p=>profiles[p.id]=p)}
  $("videoGrid").innerHTML=videos.map(v=>{
    const p=profiles[v.user_id]||{};
    const thumb=v.thumbnail_url||"";
    return `<article class="card" onclick="openWatch('${v.id}')">
      <div class="thumb">${thumb?`<img src="${esc(thumb)}" loading="lazy" alt="">`:`<div style="height:100%;display:grid;place-items:center;font-size:42px">▶</div>`}
      ${v.duration_seconds?`<span class="duration">${duration(v.duration_seconds)}</span>`:""}</div>
      <div class="cardInfo">${avatarHtml(p)}
      <div style="min-width:0"><div class="cardTitle">${esc(v.title)}</div>
      <div class="meta">${esc(p.full_name||p.username||"UTubeX creator")}<br>${formatViews(v.views)} views • ${ago(v.created_at)}</div></div></div>
    </article>`
  }).join("");
}
async function searchVideos(term){
  term=term.trim().toLowerCase();if(!term){showHome();return}
  const {data,error}=await sb.from("videos").select("*").eq("status","published").or(`title.ilike.%${term}%,description.ilike.%${term}%,tags.ilike.%${term}%`).order("created_at",{ascending:false}).limit(80);
  if(error){toast("Search failed");return}currentCategory="";setActiveChip("");$("pageTitle").textContent="Search results";allVideos=data||[];renderVideos(allVideos)
}
async function openWatch(id){
  const v=allVideos.find(x=>x.id===id)||(await sb.from("videos").select("*").eq("id",id).maybeSingle()).data;
  if(!v)return;currentVideo=v;
  $("watchTitle").textContent=v.title;$("watchMeta").textContent=formatViews(v.views)+" views • "+ago(v.created_at)+" • "+(v.category||"Entertainment");
  $("watchDesc").textContent=v.description||"";
  $("watchVideo").src=v.video_url;openModal("watchBack");
  await sb.from("videos").update({views:Number(v.views||0)+1}).eq("id",v.id);
  v.views=Number(v.views||0)+1;loadComments();checkLike();checkSubscription();
}
async function checkLike(){
  $("likeBtn").classList.remove("on");if(!currentUser||!currentVideo)return;
  const r=await sb.from("video_likes").select("id").eq("video_id",currentVideo.id).eq("user_id",currentUser.id).maybeSingle();if(r.data)$("likeBtn").classList.add("on")
}
async function toggleLike(){
  if(!(await requireLogin())||!currentVideo)return;
  const r=await sb.from("video_likes").select("id").eq("video_id",currentVideo.id).eq("user_id",currentUser.id).maybeSingle();
  if(r.data){await sb.from("video_likes").delete().eq("id",r.data.id);$("likeBtn").classList.remove("on")}
  else{const x=await sb.from("video_likes").insert({video_id:currentVideo.id,user_id:currentUser.id});if(x.error){toast("Like नहीं हो पाया");return}$("likeBtn").classList.add("on")}
}
async function loadComments(){
  if(!currentVideo)return;$("commentList").innerHTML='<div class="meta">Loading…</div>';
  const r=await sb.from("video_comments").select("id,user_id,comment,created_at").eq("video_id",currentVideo.id).order("created_at",{ascending:false}).limit(100);
  if(r.error){$("commentList").innerHTML='<div class="meta">Comments unavailable.</div>';return}
  const ids=[...new Set((r.data||[]).map(x=>x.user_id))];let ps={};
  if(ids.length){const p=await sb.from("profiles").select("id,full_name,username,avatar_url").in("id",ids);(p.data||[]).forEach(x=>ps[x.id]=x)}
  $("commentList").innerHTML=(r.data||[]).map(c=>`<div class="comment">${avatarHtml(ps[c.user_id])}<div><b>${esc(ps[c.user_id]?.full_name||ps[c.user_id]?.username||"User")}</b><p>${esc(c.comment)}</p><div class="meta">${ago(c.created_at)}</div></div></div>`).join("")||'<div class="meta">No comments yet.</div>'
}
async function addComment(){
  if(!(await requireLogin())||!currentVideo)return;const text=$("commentInput").value.trim();if(!text)return;
  const r=await sb.from("video_comments").insert({video_id:currentVideo.id,user_id:currentUser.id,comment:text});
  if(r.error){toast("Comment नहीं हो पाया");return}$("commentInput").value="";loadComments()
}
async function checkSubscription(){
  $("subBtn").classList.remove("on");if(!currentUser||!currentVideo||currentVideo.user_id===currentUser.id)return;
  const r=await sb.from("subscriptions").select("id").eq("subscriber_id",currentUser.id).eq("channel_id",currentVideo.user_id).maybeSingle();if(r.data)$("subBtn").classList.add("on")
}
async function toggleSubscription(){
  if(!(await requireLogin())||!currentVideo||currentVideo.user_id===currentUser.id)return;
  const r=await sb.from("subscriptions").select("id").eq("subscriber_id",currentUser.id).eq("channel_id",currentVideo.user_id).maybeSingle();
  if(r.data){await sb.from("subscriptions").delete().eq("id",r.data.id);$("subBtn").classList.remove("on")}
  else{const x=await sb.from("subscriptions").insert({subscriber_id:currentUser.id,channel_id:currentVideo.user_id});if(x.error){toast("Subscribe नहीं हो पाया");return}$("subBtn").classList.add("on")}
}
async function shareCurrent(){if(!currentVideo)return;const url=location.href.split("#")[0]+"#video="+currentVideo.id;if(navigator.share){try{await navigator.share({title:currentVideo.title,url})}catch(e){}}else{await navigator.clipboard?.writeText(url);toast("Video link copied")}}

function openUpload(){if(!currentUser){openModal("authBack");toast("पहले Login करें");return}openModal("uploadBack")}
function setProgress(p,text){p=Math.max(0,Math.min(100,Math.round(p)));$("uploadProgressBox").style.display="block";$("uploadBar").style.width=p+"%";$("uploadText").textContent=text||p+"%";$("ufBar").style.width=p+"%";$("ufText").textContent=text||p+"%";$("uploadFloat").style.display="block"}
function hideProgress(){setTimeout(()=>$("uploadFloat").style.display="none",2500)}
async function uploadVideoReal(file,path){
  const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error("Login required");
  return new Promise((resolve,reject)=>{
    const projectRef=new URL(SUPABASE_URL).hostname.split(".")[0];
    const endpoint=`https://${projectRef}.storage.supabase.co/storage/v1/upload/resumable`;
    const up=new tus.Upload(file,{
      endpoint,retryDelays:[0,3000,5000,10000,20000],
      headers:{authorization:"Bearer "+session.access_token},
      uploadDataDuringCreation:true,removeFingerprintOnSuccess:true,
      metadata:{bucketName:VIDEO_BUCKET,objectName:path,contentType:file.type||"video/mp4",cacheControl:"3600",upsert:"false"},
      uploadSize:file.size,
      onError:e=>reject(e),
      onProgress:(a,b)=>{const p=b?Math.round(a/b*100):0;const mb=(a/1024/1024).toFixed(1),total=(b/1024/1024).toFixed(1);setProgress(p,`Uploading ${p}% • ${mb} / ${total} MB`)},
      onSuccess:()=>resolve(`${SUPABASE_URL}/storage/v1/object/public/${VIDEO_BUCKET}/${path}`)
    });up.start();
  })
}
async function uploadThumb(file,path){
  const r=await sb.storage.from(THUMB_BUCKET).upload(path,file,{contentType:file.type,upsert:false});if(r.error)throw r.error;
  return sb.storage.from(THUMB_BUCKET).getPublicUrl(path).data.publicUrl
}
async function publishVideo(e){
  e.preventDefault();if(!currentUser)return;
  const file=$("videoFile").files[0];if(!file){toast("Video file चुनें");return}
  if(file.size>50*1024*1024){toast("इस Supabase Free project में 50 MB तक file रखें");return}
  const title=$("videoTitle").value.trim();if(!title){toast("Title डालें");return}
  $("publishBtn").disabled=true;setProgress(0,"Preparing upload…");
  try{
    const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
    const videoPath=currentUser.id+"/"+Date.now()+"-"+safe;
    const videoUrl=await uploadVideoReal(file,videoPath);
    let thumbUrl=null;const tf=$("thumbFile").files[0];
    if(tf){setProgress(100,"Uploading thumbnail…");const tp=currentUser.id+"/"+Date.now()+"-thumb-"+tf.name.replace(/[^a-zA-Z0-9._-]/g,"_");thumbUrl=await uploadThumb(tf,tp)}
    setProgress(100,"Publishing…");
    const row={user_id:currentUser.id,title,description:$("videoDesc").value.trim(),video_url:videoUrl,thumbnail_url:thumbUrl,
      category:$("videoCat").value,language:$("videoLang").value,tags:$("videoTags").value.trim(),visibility:$("videoVisibility").value,
      status:"published",views:0,likes:0,comments_count:0};
    const r=await sb.from("videos").insert(row).select().single();if(r.error)throw r.error;
    setProgress(100,"Published ✓");toast("Video successfully published");$("uploadForm").reset();closeModal("uploadBack");loadVideos();hideProgress()
  }catch(err){console.error(err);setProgress(0,"Upload failed: "+(err.message||"unknown error"));toast("Upload failed")}
  finally{$("publishBtn").disabled=false}
}
async function loadChannel(uid){
  const p=await getProfile(uid);if(!p)return;
  const r=await sb.from("videos").select("*").eq("user_id",uid).eq("status","published").order("created_at",{ascending:false}).limit(50);
  const videos=r.data||[];
  $("channelContent").innerHTML=`<div class="channelCover" style="${p.banner_url?`background-image:url('${esc(p.banner_url)}');background-size:cover;background-position:center`:""}"></div>
  <div class="channelTop">${avatarHtml(p,"channelAvatar")}<div><div class="channelName">${esc(p.full_name||p.username||"UTubeX Channel")}${p.username==="UTubeXOfficial"?'<span class="verify">✓</span>':""}</div>
  <div class="handle">@${esc(p.username||"channel")}</div></div></div>
  <div class="channelBio">${esc(p.bio||"Welcome to UTubeX.")}</div>
  ${p.username==="UTubeXOfficial"?'<div class="officialBox"><b>UTubeX Official</b><div class="meta">Official UTubeX platform channel</div></div>':""}
  <div style="padding:0 20px 20px"><h3>Videos</h3><div class="videoGrid" id="channelGrid"></div></div>`;
  openModal("channelBack");
  const ids=[...videos];allVideos=[...new Map([...allVideos,...videos].map(x=>[x.id,x])).values()];
  const g=$("channelGrid");if(!videos.length){g.innerHTML='<div class="empty" style="grid-column:1/-1">No public videos.</div>';return}
  g.innerHTML=videos.map(v=>`<article class="card" onclick="openWatch('${v.id}')"><div class="thumb">${v.thumbnail_url?`<img src="${esc(v.thumbnail_url)}" loading="lazy">`:'<div style="height:100%;display:grid;place-items:center;font-size:42px">▶</div>'}</div><div class="cardInfo">${avatarHtml(p)}<div><div class="cardTitle">${esc(v.title)}</div><div class="meta">${formatViews(v.views)} views • ${ago(v.created_at)}</div></div></div></article>`).join("")
}
async function openMyChannel(){if(!(await requireLogin()))return;await loadChannel(currentUser.id)}
async function authSubmit(){
  const email=$("authEmail").value.trim(),password=$("authPassword").value;if(!email||!password){$("authMsg").textContent="Email और password डालें";return}
  $("authSubmit").disabled=true;$("authMsg").textContent="Please wait…";
  try{
    if(authMode==="login"){
      const r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;closeModal("authBack");toast("Login successful")
    }else{
      const name=$("authName").value.trim()||email.split("@")[0];const r=await sb.auth.signUp({email,password,options:{data:{full_name:name,username:name.replace(/[^a-zA-Z0-9_]/g,"").slice(0,24)}}});if(r.error)throw r.error;
      if(r.data.user&&!r.data.session)toast("Email confirmation required");else toast("Account created")
    }
  }catch(e){$("authMsg").textContent=e.message||"Authentication failed"}finally{$("authSubmit").disabled=false}
}
function switchAuth(){authMode=authMode==="login"?"signup":"login";$("authTitle").textContent=authMode==="login"?"Login":"Create account";$("authSubmit").textContent=authMode==="login"?"Login":"Create account";$("authSwitch").textContent=authMode==="login"?"Create a new account":"I already have an account";$("signupExtra").style.display=authMode==="signup"?"block":"none";$("authMsg").textContent=""}
async function refreshAuth(){
  const r=await sb.auth.getUser();currentUser=r.data.user||null;
  $("topAvatar").style.display=currentUser?"block":"none";$("loginTop").style.display=currentUser?"none":"block";
  if(currentUser){const p=await getProfile(currentUser.id);if(p?.avatar_url)$("topAvatar").src=p.avatar_url}
}
async function logout(){await sb.auth.signOut();toast("Logged out");await refreshAuth();showHome()}
function trending(){currentCategory="";setActiveChip("");$("pageTitle").textContent="Trending";sb.from("videos").select("*").eq("status","published").order("views",{ascending:false}).limit(80).then(r=>{allVideos=r.data||[];renderVideos(allVideos)})}
function subscriptions(){toast("Subscriptions feed तैयार है; login करके channels subscribe करें")}
function setup(){
  document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>closeModal(b.dataset.close));
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{currentCategory=b.dataset.cat||"";setActiveChip(currentCategory);$("pageTitle").textContent=currentCategory||"Recommended";loadVideos()});
  document.querySelectorAll(".sideItem[data-cat]").forEach(b=>b.onclick=()=>{currentCategory=b.dataset.cat;setActiveChip(currentCategory);$("pageTitle").textContent=currentCategory;loadVideos()});
  document.querySelectorAll(".sideItem[data-page]").forEach(b=>b.onclick=()=>b.dataset.page==="trending"?trending():showHome());
  $("uploadTop").onclick=openUpload;$("heroUpload").onclick=openUpload;$("sideUpload").onclick=openUpload;$("bnCreate").onclick=openUpload;
  $("sideChannel").onclick=openMyChannel;$("bnYou").onclick=openMyChannel;$("sideLogin").onclick=()=>openModal("authBack");
  $("bnHome").onclick=showHome;$("bnTrending").onclick=trending;$("bnSubs").onclick=subscriptions;
  $("loginTop").onclick=()=>openModal("authBack");$("authSubmit").onclick=authSubmit;$("authSwitch").onclick=switchAuth;
  $("searchBtn").onclick=()=>searchVideos($("searchInput").value);$("searchInput").addEventListener("keydown",e=>{if(e.key==="Enter")searchVideos(e.target.value)});
  $("likeBtn").onclick=toggleLike;$("subBtn").onclick=toggleSubscription;$("shareBtn").onclick=shareCurrent;$("commentBtn").onclick=addComment;
  $("uploadForm").onsubmit=publishVideo;$("ufClose").onclick=()=>$("uploadFloat").style.display="none";
  $("menuBtn").onclick=()=>{if(innerWidth<=800){toast("नीचे navigation से pages खोलें")}else{$("side").classList.toggle("hidden")}};
}
(async()=>{setup();await refreshAuth();await loadVideos();sb.auth.onAuthStateChange(()=>setTimeout(refreshAuth,0));})();
</script>


<style>
#utxProfileModal .modal{width:min(1050px,100%)}
.utxBanner{height:210px;background:linear-gradient(120deg,#dbeafe,#ede9fe);background-size:cover;background-position:center;border-radius:18px 18px 0 0}
.utxHead{display:flex;gap:18px;align-items:flex-end;padding:0 22px 18px}.utxAvatar{width:112px;height:112px;border-radius:50%;object-fit:cover;background:#eee;border:5px solid #fff;margin-top:-56px}.utxName{font-size:28px;font-weight:800}.utxHandle{color:#64748b;margin-top:4px}.utxStats{color:#64748b;font-size:13px;margin-top:6px}.utxActions{display:flex;gap:10px;flex-wrap:wrap;padding:0 22px 18px}.utxTabs{display:flex;gap:4px;border-bottom:1px solid #e5e7eb;padding:0 18px;overflow:auto}.utxTabs button{background:#fff;padding:14px 16px;font-weight:700;white-space:nowrap;border-bottom:3px solid transparent}.utxTabs button.active{color:#2563eb;border-bottom-color:#2563eb}.utxContent{padding:20px}.utxEditGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.utxEditGrid .full{grid-column:1/-1}.utxEditGrid label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.utxEditGrid input,.utxEditGrid textarea{width:100%;border:1px solid #d2d2d2;border-radius:10px;padding:11px;box-sizing:border-box;background:#fff}.utxEditGrid textarea{min-height:110px;resize:vertical}
@media(max-width:800px){.utxBanner{height:145px}.utxHead{padding:0 14px 14px;gap:12px}.utxAvatar{width:82px;height:82px;margin-top:-41px}.utxName{font-size:21px}.utxContent{padding:12px}.utxEditGrid{grid-template-columns:1fr}.utxEditGrid .full{grid-column:auto}}

<div class="modalBack" id="utxProfileModal">
  <div class="modal wide">
    <div class="modalHead"><h2 id="utxProfileTitle">Channel</h2><button class="close" id="utxProfileClose">×</button></div>
    <div id="utxProfileBody"></div>
  </div>
</div>
<script>
/* UTubeX Profile/Channel extension — original upload/video code is untouched. */
(function(){
  let viewedId=null, viewedProfile=null, tab='videos';
  const U=id=>document.getElementById(id);
  const esc2=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  const avatar=p=>p?.avatar_url||'';
  async function sessionUser(){
    const r=await sb.auth.getSession();
    if(r.data?.session?.user){currentUser=r.data.session.user;return currentUser}
    return currentUser||null;
  }
  async function profile(uid){
    const r=await sb.from('profiles').select('id,full_name,username,bio,avatar_url,banner_url').eq('id',uid).maybeSingle();
    return r.data||{id:uid};
  }
  async function subs(uid){
    const r=await sb.from('subscriptions').select('id',{count:'exact',head:true}).eq('channel_id',uid);
    return Number(r.count||0);
  }
  async function subscribed(uid){
    const u=await sessionUser(); if(!u||u.id===uid)return false;
    const r=await sb.from('subscriptions').select('id').eq('subscriber_id',u.id).eq('channel_id',uid).maybeSingle();
    return !!r.data;
  }
  async function videos(uid){
    const r=await sb.from('videos').select('*').eq('user_id',uid).eq('status','published').order('created_at',{ascending:false}).limit(100);
    return r.data||[];
  }
  function videoCard(v,p){
    const id=String(v.id).replace(/'/g,"\\'");
    return `<article class="card" onclick="openWatch('${id}')"><div class="thumb">${v.thumbnail_url?`<img src="${esc2(v.thumbnail_url)}" loading="lazy" alt="">`:'<div style="height:100%;display:grid;place-items:center;font-size:42px">▶</div>'}${v.duration_seconds?`<span class="duration">${duration(v.duration_seconds)}</span>`:''}</div><div class="cardInfo">${p?.avatar_url?`<img class="miniAvatar" src="${esc2(p.avatar_url)}" alt="">`:'<div class="miniAvatar" style="display:grid;place-items:center;font-weight:800">UT</div>'}<div style="min-width:0"><div class="cardTitle">${esc2(v.title)}</div><div class="meta">${formatViews(v.views)} views • ${ago(v.created_at)}</div></div></div></article>`;
  }
  async function render(){
    const p=viewedProfile||{}; const mine=currentUser&&currentUser.id===viewedId; const n=await subs(viewedId); const isSub=await subscribed(viewedId);
    const name=p.full_name||p.username||'UTubeX Channel'; const handle=p.username?'@'+p.username:'@channel';
    const banner=p.banner_url?`background-image:url('${String(p.banner_url).replace(/'/g,'%27')}')`:'';
    const av=p.avatar_url||'';
    U('utxProfileTitle').textContent=mine?'Your Channel':'Channel';
    U('utxProfileBody').innerHTML=`<div class="utxBanner" style="${banner}"></div><div class="utxHead"><div class="utxAvatar" style="${av?`background-image:url('${String(av).replace(/'/g,'%27')}');background-size:cover;background-position:center`:''}"></div><div><div class="utxName">${esc2(name)}${p.username==='UTubeXOfficial'?'<span class="verify">✓</span>':''}</div><div class="utxHandle">${esc2(handle)}</div><div class="utxStats">${n} subscribers</div></div></div><div class="utxActions">${mine?'<button class="primary" id="utxEditBtn">✏️ Edit Channel</button>':`<button class="primary" id="utxSubBtn">${isSub?'Subscribed':'Subscribe'}</button>`}<button class="secondary" id="utxShareBtn">↗ Share</button></div><div style="padding:0 22px 16px;color:#475569;white-space:pre-wrap">${esc2(p.bio||'')}</div><div class="utxTabs"><button class="${tab==='videos'?'active':''}" data-tab="videos">Videos</button><button class="${tab==='about'?'active':''}" data-tab="about">About</button></div><div id="utxContent" class="utxContent"></div>`;
    U('utxShareBtn').onclick=async()=>{const url=location.href.split('#')[0]+'#channel='+viewedId;try{await navigator.clipboard?.writeText(url);toast('Channel link copied')}catch(e){toast('Channel link: '+url)}};
    if(mine)U('utxEditBtn').onclick=edit;
    else U('utxSubBtn').onclick=toggleSub;
    U('utxProfileBody').querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{tab=b.dataset.tab;await render()});
    const box=U('utxContent');
    if(tab==='about'){box.innerHTML=`<div class="officialBox"><b>About this channel</b><div class="meta">${esc2(p.bio||'No channel description.')}</div></div>`;return}
    const vs=await videos(viewedId); if(!vs.length){box.innerHTML='<div class="empty">इस channel पर अभी कोई public video नहीं है।</div>';return}
    allVideos=[...new Map([...allVideos,...vs].map(x=>[x.id,x])).values()];
    box.innerHTML='<div class="videoGrid">'+vs.map(v=>videoCard(v,p)).join('')+'</div>';
  }
  async function openChannel(uid){if(!uid)return;viewedId=uid;viewedProfile=await profile(uid);tab='videos';openModal('utxProfileModal');await render()}
  async function openMine(){const u=await sessionUser();if(!u){openModal('authBack');toast('पहले Login करें');return}await openChannel(u.id)}
  async function toggleSub(){
    const u=await sessionUser();if(!u){openModal('authBack');return}if(!viewedId||u.id===viewedId)return;
    const r=await sb.from('subscriptions').select('id').eq('subscriber_id',u.id).eq('channel_id',viewedId).maybeSingle();
    const x=r.data?await sb.from('subscriptions').delete().eq('id',r.data.id):await sb.from('subscriptions').insert({subscriber_id:u.id,channel_id:viewedId});
    if(x.error){toast('Subscribe नहीं हो पाया');return}await render();toast(r.data?'Unsubscribed':'Subscribed');
  }
  async function uploadImage(file,folder){
    if(!file)return null;const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=currentUser.id+'/'+folder+'-'+Date.now()+'.'+ext;
    const r=await sb.storage.from('thumbnails').upload(path,file,{upsert:false,contentType:file.type||'image/jpeg'});if(r.error)throw r.error;
    return sb.storage.from('thumbnails').getPublicUrl(path).data.publicUrl;
  }
  function edit(){
    const p=viewedProfile||{};
    U('utxProfileBody').innerHTML=`<div style="padding:20px"><h3 style="margin-top:0">Edit Channel</h3><div class="utxEditGrid"><div><label>Channel Name</label><input id="utxName" maxlength="80" value="${esc2(p.full_name||'')}"></div><div><label>Handle</label><input id="utxUsername" maxlength="40" value="${esc2(p.username||'')}"></div><div class="full"><label>Bio</label><textarea id="utxBio" maxlength="2000">${esc2(p.bio||'')}</textarea></div><div><label>Channel Logo</label><input id="utxAvatarFile" type="file" accept="image/*"></div><div><label>Channel Banner</label><input id="utxBannerFile" type="file" accept="image/*"></div></div><div class="actions"><button class="secondary" id="utxCancelEdit">Cancel</button><button class="primary" id="utxSaveBtn">Save Changes</button></div></div>`;
    U('utxCancelEdit').onclick=render;U('utxSaveBtn').onclick=save;
  }
  async function save(){
    const u=await sessionUser();if(!u||u.id!==viewedId)return;
    const name=U('utxName').value.trim();const username=U('utxUsername').value.trim().replace(/^@/,'').replace(/[^a-zA-Z0-9._-]/g,'');if(!name||username.length<3){toast('Channel name और handle सही डालें');return}
    const btn=U('utxSaveBtn');btn.disabled=true;btn.textContent='Saving…';
    try{
      let av=viewedProfile?.avatar_url||null,bn=viewedProfile?.banner_url||null;
      av=await uploadImage(U('utxAvatarFile').files[0],'avatar')||av;bn=await uploadImage(U('utxBannerFile').files[0],'banner')||bn;
      const r=await sb.from('profiles').update({full_name:name,username,bio:U('utxBio').value.trim(),avatar_url:av,banner_url:bn}).eq('id',u.id);if(r.error)throw r.error;
      viewedProfile=await profile(u.id);await refreshAuth();toast('Channel updated');await render();
    }catch(e){console.error(e);toast('Channel save नहीं हुआ: '+(e.message||'error'));btn.disabled=false;btn.textContent='Save Changes'}
  }
  U('utxProfileClose').onclick=()=>closeModal('utxProfileModal');
  window.utxOpenChannel=openChannel;window.utxOpenMyChannel=openMine;
  window.utxOpenVideoChannel=openChannel;
  function bind(){const s=U('sideChannel'),b=U('bnYou'),a=U('topAvatar');if(s)s.onclick=openMine;if(b)b.onclick=openMine;if(a){a.style.cursor='pointer';a.onclick=openMine}}
  bind();setTimeout(bind,300);setTimeout(bind,1000);
})();
</script>
